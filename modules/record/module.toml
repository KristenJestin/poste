name = "record"
description = "Screen recording (gpu-screen-recorder) driven by the island: presets, windows, screens, region"
commands = [
  { name = "start", description = "starts: start --preset ID | --window ADDR | --monitor NAME | --region [--audio A]" },
  { name = "stop", description = "stops the recording in progress (the file is finished cleanly)" },
  { name = "pause", description = "pauses" },
  { name = "resume", description = "resumes" },
  { name = "toggle", description = "pause or resume" },
  { name = "status", description = "state as JSON (recording, paused, label, file…)" },
  { name = "watch", description = "one JSON line per state change (for the island)" },
  { name = "items", description = "list of the launcher's \"Record\" extension (JSON)" },
  { name = "hotkey", description = "SHIFT+PRINT: stops the recording in progress, otherwise opens the launcher on Record" },
  { name = "open-dir", description = "opens the recordings folder (--preset ID)" },
  { name = "open-last", description = "opens the last recording (--preset ID)" },
]

# Line put by `poste sys setup` in a file without includes: the screen-share picker
# of xdg-desktop-portal-hyprland picks alone the window requested by `poste record`.
# bin/poste-share-picker is a short script that runs `poste-record share-picker` (stable path).
[[line]]
file = "~/.config/hypr/xdph.conf"
line = "screencopy:custom_picker_binary = {modules}/record/bin/poste-share-picker"
