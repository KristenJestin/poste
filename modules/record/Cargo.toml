[package]
name = "poste-record"
description = "Record module of poste: screen recording (gpu-screen-recorder) driven by the island"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "poste_record"
path = "src/lib.rs"

[[bin]]
name = "poste-record"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# Regular expressions of the presets (window.class / window.title), like `re.search(..., re.I)` of the original script.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
