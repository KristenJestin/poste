[package]
name = "poste-record"
description = "Module record de poste : enregistrement d'écran (gpu-screen-recorder) piloté par l'île"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "poste_record"
path = "src/lib.rs"

[[bin]]
name = "poste-record"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# Expressions régulières des préréglages (window.class / window.title), comme `re.search(..., re.I)` du script d'origine.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
