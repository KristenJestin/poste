[package]
name = "poste-music"
description = "Module music de poste : client Navidrome (Subsonic), copie locale et recherche"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "poste-music"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
getrandom = "0.3"
libc = "0.2"
libmpv2 = "6"
md5 = "0.7"
poste-core.workspace = true
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq = { version = "2", features = ["json"] }
zbus = "5"

[dev-dependencies]
tempfile.workspace = true
