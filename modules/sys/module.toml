name = "sys"
description = "Manages the poste repository: build, install, status, git"
commands = [
  { name = "setup", description = "builds and installs poste and its modules (--yes, --dry-run)" },
  { name = "status", description = "state of the repository, the installed modules and the files put in place" },
  { name = "git", description = "runs git -C <repository> <args…>" },
  { name = "cd", description = "prints the path of the repository" },
  { name = "diff", description = "compares the repository's config with the one in ~ ([path])" },
  { name = "add", description = "puts a file of ~ under management (moved into config/, replaced by a link)" },
  { name = "forget", description = "puts an ordinary file back in place of the link" },
  { name = "sync", description = "git pull --ff-only (repository and data repository) then setup (preview included)" },
  { name = "done", description = "marks a manual step done (<id>, --undo; without id: list)" },
  { name = "local", description = "config files kept to this machine (list, add <path>, remove <path>)" },
  { name = "module", description = "modules disabled on this machine (list, enable <name>, disable <name>)" },
  { name = "override", description = "JSON overrides of this machine (list, set <path> <key> <value>, unset <path> <key>)" },
  { name = "import-chezmoi", description = "imports the config managed by chezmoi into config/" },
]
