name = "sys"
description = "Gère le dépôt poste : construction, installation, état, git"
commands = [
  { name = "setup", description = "construit et installe poste et ses modules (--yes, --dry-run)" },
  { name = "status", description = "état du dépôt, des modules installés et des fichiers posés" },
  { name = "git", description = "lance git -C <dépôt> <args…>" },
  { name = "cd", description = "affiche le chemin du dépôt" },
  { name = "diff", description = "compare la config du dépôt à celle de ~ ([chemin])" },
  { name = "add", description = "met un fichier de ~ sous gestion (déplacé dans config/, remplacé par un lien)" },
  { name = "forget", description = "remet un fichier ordinaire à la place du lien" },
  { name = "sync", description = "git pull --ff-only puis setup (aperçu compris)" },
  { name = "import-chezmoi", description = "importe la config gérée par chezmoi dans config/" },
]
