name = "usage"
description = "AI agent quotas (Claude Code, Codex…), their history, and the consumption read back from the agents' logs"
commands = [
  { name = "[agent]", description = "quotas of an agent (claude by default), refreshed if older than 5 min" },
  { name = "--all", description = "quotas of all the agents recorded" },
  { name = "--refresh", description = "forces a new reading before showing" },
  { name = "--json", description = "the collector's raw record (JSON)" },
  { name = "history [agent] [--since <date>] [--json]", description = "history of the readings (last 24 hours by default)" },
  { name = "calls [--since <date>] [--until <date>] [--agent claude|codex] [--json]", description = "one call per line, duplicates removed: model, effort, sub-agent, tokens (input, cache read/write, output, reasoning)" },
  { name = "windows [--since <date>] [--agent …] [--json]", description = "5 h windows: peak, time to the cap, calls, parallel sessions, effort and model shares, tokens per point" },
  { name = "compare <start>..<end> <start>..<end> [--json]", description = "the indicators of the windows of two periods, side by side" },
  { name = "record", description = "reads the quotas and adds to the history what changed (the timer, every 5 min)" },
]

# Timer put in place and enabled by `poste sys setup` (its service poste-usage-record.service is next to it in systemd/).
units = ["poste-usage-record.timer"]
