name = "power"
description = "Alertes batterie (faible, critique, branché mais ça se vide) et disque presque plein, par un démon utilisateur léger"
commands = [
  { name = "status", description = "batterie, secteur, disques, seuils et alertes déjà envoyées" },
  { name = "test", description = "envoie une notification d'exemple (même style que les vraies alertes)" },
  { name = "check", description = "une passe : lit l'état et envoie les alertes dues (ce que fait le démon toutes les minutes)" },
  { name = "watch", description = "le démon : une passe toutes les 60 s (lancé par l'unité systemd poste-power.service)" },
]

# Unité systemd utilisateur posée et activée par `poste sys setup` (fichier dans systemd/).
units = ["poste-power.service"]
