name = "power"
description = "Battery alerts (low, critical, plugged in but draining) and almost full disk, through a light user daemon"
commands = [
  { name = "status", description = "battery, mains, disks, thresholds and alerts already sent" },
  { name = "test", description = "sends a sample notification (same style as the real alerts)" },
  { name = "check", description = "one pass: reads the state and sends the alerts that are due (what the daemon does every minute)" },
  { name = "watch", description = "the daemon: one pass every 60 s (started by the systemd unit poste-power.service)" },
]

# User systemd unit installed and enabled by `poste sys setup` (file in systemd/).
units = ["poste-power.service"]
