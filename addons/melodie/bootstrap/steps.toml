# Steps of the melodie add-on, merged with bootstrap/steps.toml when the add-on is chosen.

# Installed at its latest release (pre-releases included) if absent, then moved by
# `poste sys update`. install.sh puts melodie and melodie-desktop in ~/.local/bin and
# melodie.desktop (the launcher's app, which MPRIS's DesktopEntry names) in
# ~/.local/share/applications; it never touches the config, the local copy nor the keyring. It
# stops the running player to swap it: while Mélodie plays, nothing is replaced (`busy`) rather
# than cutting the music; run the update again later.
[[app]]
id = "melodie"
title = "Mélodie (music player) in ~/.local/bin"
github = "KristenJestin/melodie"
prerelease = true
asset = "melodie-{version}-linux-x86_64.tar.gz"
script = "melodie-{version}-linux-x86_64/install.sh"
version = ["@HOME@/.local/bin/melodie", "--version"]
busy = ["sh", "-c", "busctl --user get-property org.mpris.MediaPlayer2.melodie /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player PlaybackStatus 2>/dev/null | grep -q Playing"]

[[manual]]
id = "melodie-login"
title = "Mélodie: melodie login in a terminal (Navidrome server), once"

# The handler of melodie: addresses (xdg-open melodie:album/<id>): Mélodie does not install it,
# the desktop adds it.
[[file]]
id = "melodie-open-entry"
title = "Mélodie: handler of melodie: addresses"
target = "@HOME@/.local/share/applications/melodie-open.desktop"
source = "files/melodie-open.desktop"

[[user]]
id = "melodie-scheme"
title = "Mélodie: melodie: addresses open with melodie open"
check = ["sh", "-c", "[ \"$(xdg-mime query default x-scheme-handler/melodie)\" = melodie-open.desktop ]"]
run = [["xdg-mime", "default", "melodie-open.desktop", "x-scheme-handler/melodie"]]
