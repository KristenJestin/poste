name = "vocaline"
requires = "vocaline"
description = "Vocaline dictation: SUPER+A, dictation pill at the bottom of the screen and live dictated text under the island"
commands = [
  { name = "press", description = "dictation key pressed (SUPER+A): opens the microphone" },
  { name = "release", description = "key released: held, stops and pastes; tapped, the dictation goes on" },
  { name = "status", description = "state of the Vocaline daemon" },
  { name = "watch", description = "JSON event stream, one per line (for the island)" },
]
