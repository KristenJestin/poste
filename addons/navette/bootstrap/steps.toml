# Steps of the navette add-on, merged with bootstrap/steps.toml when the add-on is chosen.
# Written for Navette 0.2.0 and later (`install.sh`, `navette run`, `navette.service`, `events.sock`).

# Installed at its latest release if absent, then moved by `poste sys update`. The archive's
# install.sh puts navette in ~/.local/bin, its icon and its user units, then `daemon-reload`; it
# enables and starts nothing. Never replaced while a mode starts, runs or stops (`busy`): that
# would cut the session at the restart below; run the update again later. When Navette runs but
# its state cannot be read (no answer within 5 s, an older version), it counts as busy too.
[[app]]
id = "navette"
title = "Navette (work-from-home mode) in ~/.local/bin"
github = "KristenJestin/navette"
asset = "navette-{version}-linux-x86_64.tar.gz"
script = "navette-{version}-linux-x86_64/install.sh"
version = ["@HOME@/.local/bin/navette", "--version"]
busy = ["sh", "-c", "out=$(timeout 5 \"@HOME@/.local/bin/navette\" watch --json --once 2>/dev/null) || { [ -S \"${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/navette/events.sock\" ]; exit; }; printf %s \"$out\" | grep -qE '\"state\": *\"(starting|mode|stopping)\"'"]

# One unit, the same on both machines: `navette run --audio` reads the role of the pairing and
# runs `serve` (desk) or `agent` (remote). poste never decides when it runs: away from the
# desk's network, the agent sleeps (`away`). Not paired yet: it exits without looping. No
# `requires`: it is read when the plan is made, before the install above on a first setup.
[[user]]
id = "navette-enable"
title = "Navette: service enabled and started"
check = ["systemctl", "--user", "is-enabled", "--quiet", "navette.service"]
run = [["systemctl", "--user", "daemon-reload"], ["systemctl", "--user", "enable", "--now", "navette.service"]]

# After an update, the running service still has the old binary: restarted (never during a
# mode, see `busy`). Both machines must run the same minor version: update them together.
[[user]]
id = "navette-restart"
title = "Navette: service restarted on the new version"
requires = "navette"
trigger = ["navette"]
run = [["systemctl", "--user", "try-restart", "navette.service"]]

# Pairing, once, by hand: the desk shows a PIN that the remote asks for. The service exits
# while there is no pairing, so it is restarted afterwards. Details: addons/navette/README.md.
# No check: poste does not read Navette's files; `poste sys done navette-pair` once paired.
[[manual]]
id = "navette-pair"
title = "Navette: pair the two machines (navette pair), systemctl --user restart navette, then poste sys done navette-pair"

# The desk only: its firewall lets the remote reach the pairing port. The rule holds the
# machines' addresses: printed from the README, typed with sudo, never in this repository.
# Done by itself once ufw holds a rule commented `navette` (ufw writes the comment in hex in
# its rules file, readable without root on Omarchy; where it is not, `poste sys done navette-firewall`). On the remote: `poste sys skip add navette-firewall`.
[[manual]]
id = "navette-firewall"
title = "Navette, desk only: ufw rule for the remote, commented navette (addons/navette/README.md), or poste sys done navette-firewall"
check = ["grep", "-q", "comment=6e617665747465", "/etc/ufw/user.rules"]
