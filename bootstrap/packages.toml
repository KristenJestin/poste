# Packages expected on the machine (pacman/AUR). `poste sys setup` compares them with `pacman -Qq`
# and prints the `yay -S --needed …` command for the missing ones (it does not install it).
# Only what is not already in Omarchy 4's base install
# (/usr/share/omarchy/install/omarchy-*.packages) and what this environment depends on.
# Key = package name, value = what it is for.
[packages]
rust = "cargo: builds poste (./setup)"
github-cli = "gh (git HTTPS auth, credential helper in git/config)"
direnv = "hook in .bashrc"
ttf-fira-code = "terminal font (foot / alacritty / ghostty)"
ttf-firacode-nerd = "Nerd Font glyphs of the font"
libqalculate = "qalc: calculator of the island's launcher"
python = "launcher sources (unity-projects), recolor.py of cursor-accent"
libnotify = "notify-send (launcher sources)"
cuda = "Vocaline and Emory on the graphics card"
cudnn = "Emory: sherpa-onnx (onnxruntime) on the graphics card"
zen-browser-bin = "browser"
t3code-nightly-bin = "T3 Code (theme generated by ~/.config/omarchy/themed/t3code.json.tpl)"
proton-pass-bin = "passwords (SUPER+SHIFT+.)"
unityhub = "Unity Hub"
unity-cli-bin = "'unity' CLI ('Unity Projects' source of the launcher)"
proton-vpn-cli = "Proton VPN (driven by the OmaProton plugin, VPN tile of the island)"
proton-vpn-daemon = "Proton VPN daemon"
protonmail-bridge = "Proton Mail Bridge (local IMAP/SMTP for Omamail)"
# Strata, the file manager (binary in ~/.local/bin, steps.toml): its runtime libraries.
# Already in Omarchy's base: fontconfig, ffmpegthumbnailer (video thumbnails), imagemagick, gvfs-smb.
bubblewrap = "Strata: sandbox of its previews and of its folder reading"
gtk4 = "Strata: toolkit"
gtksourceview5 = "Strata: text and code previews"
gstreamer = "Strata: audio and video previews"
gst-plugins-base = "Strata: audio and video previews (base elements)"
gst-plugins-good = "Strata: preview of mp4 files, such as the screen recordings (demuxer)"
gst-libav = "Strata: preview of mp4 files, such as the screen recordings (H.264 decoder)"
poppler-glib = "Strata: PDF previews"
gvfs = "Strata: trash, mounted volumes and remote locations"
headsetcontrol = "wireless headset battery (island: DevicesState)"
zip = "LocalSend of a folder (zipped first)"
# Optional, installed on the original machine, not required: opencode-bin dotnet-runtime-9.0
