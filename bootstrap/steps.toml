# Steps to set up the machine, read by `poste sys setup` / `status` / `done`.
# Substitutions in the texts and commands: @HOME@ @USER@ @UID@ @GID@ @REPO@ @BOOTSTRAP@
# (bootstrap/ folder of the repository). The `source`/`patch` paths are relative to bootstrap/.
#
# Four families:
#   [[plugin]]  third-party plugin of the Omarchy shell, pinned to a commit, optional local patch
#               (done by poste, with a preview and a confirmation)
#   [[user]]    step without sudo: `check` (code 0 = already done), otherwise `run` (poste runs it)
#   [[system]]  step with sudo: poste checks, PRINTS the commands, never runs them
#   [[manual]]  step by hand; optional `check`, otherwise `poste sys done <id>`

# ------------------------------------------------------------ third-party plugins (audited versions)
# poste.island, poste.notifications, poste.osd and poste.workspaces come from config/ (links).
[[plugin]]
id = "crmne.mpris"
url = "https://github.com/crmne/omarchy-mpris"
commit = "85bb4ff"

[[plugin]]
id = "jankeesvw.notification-center"
url = "https://github.com/jankeesvw/omarchy-notification-center"
commit = "e4c4568"

[[plugin]]
id = "io.github.honeyspoons.localsend"
url = "https://github.com/HoneySpoons/omarchy-localsend.git"
commit = "eef3289"

[[plugin]]
id = "omamail"
url = "https://github.com/huacnlee/omamail"
commit = "a7388fa" # tag v0.10.8
# Mail sorting (text or number dates counted as 0), Delete key, AI and calendar hidden,
# wait at startup, island style.
patch = "patches/omamail-local.patch"

[[plugin]]
id = "io.github.grichard99.omaproton-vpn"
url = "https://github.com/grichard99/omaproton-vpn"
commit = "6d68681"

[[plugin]]
id = "io.github.smoothpixels.cursor-accent"
url = "https://github.com/SmoothPixels/cursor-accent"
commit = "97e001c"
# recolor.py: stroke_scale option (thinner outline).
patch = "patches/cursor-accent-stroke-scale.patch"

# ------------------------------------------------------------ user steps (no sudo)
[[file]]
id = "cursor-accent-config"
title = "cursor-accent config (orange accent, thin outline)"
target = "@HOME@/.local/state/cursor-accent/config.json"
source = "files/cursor-accent-config.json"
json = true # JSON comparison, not bytes

[[user]]
id = "cursor-accent-recolor"
title = "recolor the cursor with the current theme"
# No state to check: run only if the plugin or its config has just been put in place.
trigger = ["cursor-accent-config", "io.github.smoothpixels.cursor-accent"]
run = [["sh", "-c", "python3 \"@HOME@/.config/omarchy/plugins/io.github.smoothpixels.cursor-accent/recolor.py\" \"$(omarchy-theme-current 2>/dev/null || echo unknown)\""]]

[[user]]
id = "omarchy-crash-watch-off"
title = "omarchy-crash-watch.service disabled"
check = ["sh", "-c", "! systemctl --user is-enabled --quiet omarchy-crash-watch.service && ! systemctl --user is-active --quiet omarchy-crash-watch.service"]
run = [["systemctl", "--user", "disable", "--now", "omarchy-crash-watch.service"]]

[[user]]
id = "flea-default"
title = "Flea as default file manager (folders, 'Show in folder', picker)"
# Idempotent: mimeapps.list, D-Bus service FileManager1, portals.conf. 'flea --default off' goes back.
requires = "flea"
check = ["sh", "-c", "[ \"$(xdg-mime query default inode/directory)\" = com.thisisgm.flea.desktop ]"]
run = [["flea", "--default"], ["systemctl", "--user", "restart", "xdg-desktop-portal"]]

[[user]]
id = "theme-poste"
title = "poste-theme theme"
requires = "omarchy"
check = ["sh", "-c", "[ \"$(omarchy-theme-current | tr 'A-Z ' 'a-z-')\" = poste-theme ]"]
run = [["omarchy", "theme", "set", "poste-theme"]]


# ------------------------------------------------------------ system steps (sudo, never run by poste)
[[system]]
id = "polkit-systemd-creds"
title = "systemd-creds polkit rule (Unity Hub / CLI without a password)"
file = "/etc/polkit-1/rules.d/49-systemd-creds-@USER@.rules"
source = "system/polkit-systemd-creds.rules"
# rules.d is only readable by root: poste cannot check, the step stays shown
# until `poste sys done polkit-systemd-creds`.

# ------------------------------------------------------------ manual steps
[[manual]]
id = "gh-auth"
title = "GitHub: gh auth login, then gh auth setup-git"
check = ["gh", "auth", "status"]

[[manual]]
id = "zen-theme"
title = "Zen: Settings, Appearance: choose the wanted dark internal theme"

[[manual]]
id = "unity-login"
title = "Unity Hub: sign in (then unity auth login for the CLI if needed)"

[[manual]]
id = "proton-bridge"
title = "Proton Mail Bridge: start it, sign in; Settings: 'Open on startup' ON, 'Automatic updates' OFF. Note the Bridge password (different from the Proton one)"

[[manual]]
id = "omamail-backend"
title = "Omamail (SUPER+SHIFT+M): click 'Install backend' in the window (GitHub release checked with SHA256SUMS), then add the Proton account with the Bridge password (IMAP 127.0.0.1:1143 / SMTP 1025, STARTTLS: Proton preset)"

[[manual]]
id = "proton-vpn"
title = "Proton VPN: sign in from the OmaProton panel (VPN tile of the island's control center) or 'protonvpn signin'"

[[manual]]
id = "secrets"
title = "Unversioned secrets to restore: ~/.ssh, .env files, ~/.npmrc, credentials"

[[manual]]
id = "reboot-session"
title = "Restart the session to validate everything"
