# Steps to set up the machine, read by `poste sys setup` / `status` / `done`.
# Substitutions in the texts and commands: @HOME@ @USER@ @UID@ @GID@ @REPO@ @BOOTSTRAP@
# (bootstrap/ folder of the repository). The `source`/`patch` paths are relative to bootstrap/.
#
# Families:
#   [[plugin]]  third-party plugin of the Omarchy shell, optional local patch
#               (done by poste, with a preview and a confirmation)
#   [[app]]     program published as a GitHub release (installed by poste if absent, see below)
#   [[user]]    step without sudo: `check` (code 0 = already done), otherwise `run` (poste runs it)
#   [[system]]  step with sudo: poste checks, PRINTS the commands, never runs them
#   [[manual]]  step by hand; optional `check`, otherwise `poste sys done <id>`

# ------------------------------------------------------------ third-party plugins
# Not pinned: installed at their latest tag (otherwise their default branch), moved by
# `poste sys update` after a look at the new commits; a `patch` is taken off and put back.
# poste.island, poste.notifications, poste.osd and poste.workspaces come from config/ (links).
[[plugin]]
id = "crmne.mpris"
url = "https://github.com/crmne/omarchy-mpris"

[[plugin]]
id = "jankeesvw.notification-center"
url = "https://github.com/jankeesvw/omarchy-notification-center"

[[plugin]]
id = "io.github.honeyspoons.localsend"
url = "https://github.com/HoneySpoons/omarchy-localsend.git"

[[plugin]]
id = "omamail"
url = "https://github.com/huacnlee/omamail"
# Made on v0.11.0. Mail sorted by date (a local IMAP bridge numbers mails without following
# the date), Delete key, AI and calendar hidden, a wait for that bridge at startup (accounts
# served on this machine only), island style. The added code lives in files of its own
# (BridgeSettle.qml, DateSort.js, SenderAvatar.qml) so that updates touch little.
patch = "patches/omamail-local.patch"

[[plugin]]
id = "io.github.grichard99.omaproton-vpn"
url = "https://github.com/grichard99/omaproton-vpn"

[[plugin]]
id = "io.github.smoothpixels.cursor-accent"
url = "https://github.com/SmoothPixels/cursor-accent"
# recolor.py: stroke_scale option (thinner outline).
patch = "patches/cursor-accent-stroke-scale.patch"

# ------------------------------------------------------------ user steps (no sudo)
[[file]]
id = "cursor-accent-config"
title = "cursor-accent config (orange accent, thin outline)"
target = "@HOME@/.local/state/cursor-accent/config.json"
source = "files/cursor-accent-config.json"
json = true # JSON comparison, not bytes

[[user]]
id = "cursor-accent-recolor"
title = "recolor the cursor with the current theme"
# No state to check: run only if the plugin or its config has just been put in place.
trigger = ["cursor-accent-config", "io.github.smoothpixels.cursor-accent"]
run = [["sh", "-c", "python3 \"@HOME@/.config/omarchy/plugins/io.github.smoothpixels.cursor-accent/recolor.py\" \"$(omarchy-theme-current 2>/dev/null || echo unknown)\""]]

# Omamail's backend: the exact version its plugin asks for (`backend-version`), from its GitHub
# release, SHA256SUMS checked, by the plugin's own installer (the same as 'Install backend' in
# its window). Due when its status is not `ready` (nothing while the plugin is absent: its
# trigger runs it once the plugin is added), and again once the plugin has moved.
[[user]]
id = "omamail-backend"
title = "Omamail: backend of the version the plugin asks for"
requires = "python3"
trigger = ["omamail"]
check = ["sh", "-c", "d=\"@HOME@/.config/omarchy/plugins/omamail\"; [ ! -d \"$d\" ] || python3 \"$d/scripts/backend-runtime.py\" status | grep -q '\"state\": \"ready\"'"]
run = [["sh", "@HOME@/.config/omarchy/plugins/omamail/scripts/install-backend.sh"]]

[[user]]
id = "omarchy-crash-watch-off"
title = "omarchy-crash-watch.service disabled"
check = ["sh", "-c", "! systemctl --user is-enabled --quiet omarchy-crash-watch.service && ! systemctl --user is-active --quiet omarchy-crash-watch.service"]
run = [["systemctl", "--user", "disable", "--now", "omarchy-crash-watch.service"]]

# ------------------------------------------------------------ Strata, the file manager
# A patched build of Strata (KristenJestin/strata-local, public), installed in ~/.local/bin. An old
# Omarchy `strata` package may still be in /usr/bin and come first in the PATH: everything here
# calls @HOME@/.local/bin/strata explicitly. Strata is a single instance: after an update, its
# open windows keep the old binary until they are all closed.
# Installed at its latest release if absent, then moved by `poste sys update`. The upstream
# desktop file (files/strata/io.github.lgse.Strata.desktop) comes from its repository.
[[app]]
id = "strata"
title = "Strata (file manager) in ~/.local/bin"
github = "KristenJestin/strata-local"
asset = "strata-x86_64.tar.gz"
bin = "strata"
version = ["@HOME@/.local/bin/strata", "--version"]

# The upstream desktop entry with the explicit path: it hides the one of a system package.
[[file]]
id = "strata-desktop"
title = "Strata: desktop entry pointing to ~/.local/bin/strata"
target = "@HOME@/.local/share/applications/io.github.lgse.Strata.desktop"
source = "files/strata/io.github.lgse.Strata.desktop"

[[user]]
id = "strata-default"
title = "Strata as the default file manager (folders)"
check = ["sh", "-c", "[ \"$(xdg-mime query default inode/directory)\" = io.github.lgse.Strata.desktop ]"]
run = [["xdg-mime", "default", "io.github.lgse.Strata.desktop", "inode/directory"]]

# 'Show in folder' of browsers and GTK apps: org.freedesktop.FileManager1, activated on demand.
# A single per-user provider of that name: any other file of ~/.local/share/dbus-1/services with
# `Name=org.freedesktop.FileManager1` must be removed first (two are picked at random). Never
# Strata's own "default file manager" setting: it writes a block in ~/.config/hypr/bindings.lua,
# which is a link to this repository.
[[file]]
id = "strata-filemanager1"
title = "Strata answers 'Show in folder' (D-Bus org.freedesktop.FileManager1)"
target = "@HOME@/.local/share/dbus-1/services/io.github.lgse.Strata.FileManager1.service"
source = "files/strata/io.github.lgse.Strata.FileManager1.service"

[[user]]
id = "strata-dbus-reload"
title = "reload the D-Bus services of the session"
trigger = ["strata-filemanager1"]
run = [["gdbus", "call", "--session", "--dest", "org.freedesktop.DBus", "--object-path", "/org/freedesktop/DBus", "--method", "org.freedesktop.DBus.ReloadConfig"]]

# Open and Save dialogs through the portal (Qt apps too: QT_QPA_PLATFORMTHEME in hyprland.lua).
# Strata's own command: portal files in ~/.local/share, `FileChooser=strata;<previous>` in
# ~/.config/xdg-desktop-portal/, then restarts the portal (open file dialogs close).
# `~/.local/bin/strata --uninstall-portal` goes back.
[[user]]
id = "strata-portal"
title = "Strata as the file chooser (Open / Save dialogs)"
check = ["sh", "-c", "grep -qs '^Exec=@HOME@/.local/bin/strata --portal' '@HOME@/.local/share/dbus-1/services/org.freedesktop.impl.portal.desktop.strata.service' && cat \"${XDG_CONFIG_HOME:-@HOME@/.config}\"/xdg-desktop-portal/*portals.conf 2>/dev/null | grep -qE '^org\\.freedesktop\\.impl\\.portal\\.FileChooser=strata(;|$)'"]
run = [["@HOME@/.local/bin/strata", "--install-portal"]]

# The 'Send with Taildrop' action of Strata's context menu. Real files, not links of config/:
# Strata refuses a linked manifest, script or action folder.
[[file]]
id = "strata-taildrop-action"
title = "Strata: 'Send with Taildrop' action (manifest)"
target = "@HOME@/.config/strata/actions/taildrop/action.toml"
source = "files/strata/taildrop/action.toml"

[[file]]
id = "strata-taildrop-choices"
title = "Strata: 'Send with Taildrop' action (devices)"
target = "@HOME@/.config/strata/actions/taildrop/choices"
source = "files/strata/taildrop/choices"
mode = "755"

[[file]]
id = "strata-taildrop-run"
title = "Strata: 'Send with Taildrop' action (script)"
target = "@HOME@/.config/strata/actions/taildrop/run.sh"
source = "files/strata/taildrop/run.sh"
mode = "755"

# Internet shortcuts (.url, what Taildrop receives when a phone shares a link): opening one opens
# its http(s) address in the browser, not the file in an editor. The file is kept.
[[file]]
id = "open-url-script"
title = "Internet shortcuts (.url): script opening their address"
target = "@HOME@/.local/share/poste/open-url.sh"
source = "files/open-url/open-url.sh"
mode = "755"

[[file]]
id = "open-url-entry"
title = "Internet shortcuts (.url): desktop entry"
target = "@HOME@/.local/share/applications/open-url.desktop"
source = "files/open-url/open-url.desktop"

[[user]]
id = "open-url-default"
title = "Internet shortcuts (.url) open their address"
check = ["sh", "-c", "[ \"$(xdg-mime query default application/x-mswinurl)\" = open-url.desktop ]"]
run = [["xdg-mime", "default", "open-url.desktop", "application/x-mswinurl"]]

[[user]]
id = "theme-poste"
title = "poste-theme theme"
requires = "omarchy"
check = ["sh", "-c", "[ \"$(omarchy-theme-current | tr 'A-Z ' 'a-z-')\" = poste-theme ]"]
run = [["omarchy", "theme", "set", "poste-theme"]]

# Zen in the theme's colors: Omarchy renders config/.config/omarchy/themed/zen.css.tpl into the
# current theme at each theme change; the default profile's chrome/userChrome.css is a link to
# it, its user.js a link to files/zen/user.js. Zen reads both at start.
# zen.css missing (the template was added after the theme was set): the current theme is applied
# again, like a theme change (themed apps reloaded by signals, same background).
[[user]]
id = "zen-theme-render"
title = "Zen: zen.css rendered in the current theme"
requires = "omarchy"
check = ["sh", "-c", "[ -f \"@HOME@/.local/state/omarchy/current/theme/zen.css\" ]"]
run = [["omarchy-theme-refresh"]]

[[user]]
id = "zen-userchrome"
title = "Zen: userChrome.css and user.js of the default profile (restart Zen to apply)"
requires = "zen-browser"
check = ["sh", "@BOOTSTRAP@/files/zen/link-profile.sh", "--check", "@BOOTSTRAP@/files/zen/user.js"]
run = [["sh", "@BOOTSTRAP@/files/zen/link-profile.sh", "@BOOTSTRAP@/files/zen/user.js"]]


# ------------------------------------------------------------ system steps (sudo, never run by poste)
[[system]]
id = "polkit-systemd-creds"
title = "systemd-creds polkit rule (Unity Hub / CLI without a password)"
file = "/etc/polkit-1/rules.d/49-systemd-creds-@USER@.rules"
source = "system/polkit-systemd-creds.rules"
# rules.d is only readable by root: poste cannot check, the step stays shown
# until `poste sys done polkit-systemd-creds`.

# ------------------------------------------------------------ manual steps
[[manual]]
id = "gh-auth"
title = "GitHub: gh auth login, then gh auth setup-git"
check = ["gh", "auth", "status"]

[[manual]]
id = "unity-login"
title = "Unity Hub: sign in (then unity auth login for the CLI if needed)"

[[manual]]
id = "proton-bridge"
title = "Proton Mail Bridge: start it, sign in; Settings: 'Open on startup' ON, 'Automatic updates' OFF. Note the Bridge password (different from the Proton one)"

[[manual]]
id = "omamail-account"
title = "Omamail (SUPER+SHIFT+M): add the Proton account with the Bridge password (IMAP 127.0.0.1:1143 / SMTP 1025, STARTTLS: Proton preset)"

[[manual]]
id = "proton-vpn"
title = "Proton VPN: sign in from the OmaProton panel (VPN tile of the island's control center) or 'protonvpn signin'"

[[manual]]
id = "secrets"
title = "Unversioned secrets to restore: ~/.ssh, .env files, ~/.npmrc, credentials"

[[manual]]
id = "reboot-session"
title = "Restart the session to validate everything"
