<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Icônes Tabler dans le shell Omarchy (poste, bootstrap/icons/README.md).

  À poser dans ~/.config/fontconfig/conf.d/ (lu par /etc/fonts/conf.d/50-user.conf),
  jamais dans fonts.conf : omarchy-font-set le réécrit en entier.

  Pour le seul processus du shell (quickshell), « monospace » devient « Poste Nerd Font » :
  FiraCode Nerd Font dont les icônes Nerd utilisées par Omarchy sont dessinées par Tabler.
  Les terminaux et les autres applis ne sont pas touchés.

  Pourquoi assign_replace et pas prepend_first : conf.d est lu AVANT fonts.conf, dont la règle
  ajoute FiraCode en tête tant que « monospace » reste dans la liste (45-generic et
  49-sansserif l'y remettent plusieurs fois). La liste entière est donc remplacée, sans
  « monospace », avec des secours explicites.
-->
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Poste Nerd Font</string>
      <string>FiraCode Nerd Font</string>
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
