# Strata custom action (format: docs/custom-actions.md of Strata). Put in place by
# `poste sys setup` as real files: Strata refuses a linked manifest or script.
# The `choices` script beside it (local patch of the build) turns the entry into a
# submenu of the online Taildrop devices; the picked one arrives as STRATA_ACTION_CHOICE.
schema_version = 1
id = "taildrop"
name = "Send with Taildrop"
description = "Sends the selected files to a device of the tailnet."
icon = "monitor"
enabled = true
menu = "top"

[when]
kinds = ["file"]

[run]
runtime = "bash"
entrypoint = "run.sh"
mode = "whole-selection"
