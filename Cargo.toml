[workspace]
resolver = "2"
# Rust modules only: a script module (condense…) has no Cargo.toml and is not listed.
members = ["core", "poste", "modules/sys", "modules/record", "modules/power", "modules/usage"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
poste-core = { path = "core" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
