# Archive of a poste version (binaries + config/ + bootstrap/ + module files), which
# `poste sys sync` installs on the machines in release mode.
# - on a pull request: only built (artifact), to check that it builds;
# - on a push to main: published in the `latest` prerelease (fixed address:
#   .../releases/download/latest/<archive>), with its sha256 sum.
# Built in an Arch container: the target is Arch x86_64 (the machine's glibc and libmpv).
# Third-party actions are pinned to a commit (the version is in a comment).
name: archive

on:
  push:
    branches: [main]
  pull_request:

# The build job only reads: the right to write is given only to the publication.
permissions:
  contents: read

concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Packages
        run: pacman -Syu --noconfirm --needed base-devel git rust mpv

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Safe repository for git (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release --locked

      - name: Archive
        run: .github/package.sh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poste-x86_64-linux
          path: dist/

  # Publication: only on main, with the right to write, and building nothing here (it only
  # picks up the artifact of the previous job).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: poste-x86_64-linux
          path: dist/

      # Never a moment without a prerelease: `latest` is no longer deleted to be recreated. If it
      # exists, its files are replaced (--clobber) then its tag is moved to the built
      # commit; otherwise (first run) it is created. During the replacement of the
      # files (a few seconds) a `sync` may read a sum that does not match the
      # archive: it then refuses the archive without installing anything and succeeds on the next run.
      - name: Publish to the latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest version built from main ($GITHUB_SHA). Installed by \`poste sys sync\` in release mode."
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "latest" \
              --notes "$notes"
          fi
