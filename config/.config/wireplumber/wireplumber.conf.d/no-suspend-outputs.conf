# No audio output goes to sleep when nothing plays: otherwise a short
# sound (island: end of an AI answer, timer…) arrives while the output is
# waking up and gets lost. All ALSA outputs (USB headset, sound card, HDMI),
# whatever hardware is plugged in; inputs (microphones) keep suspending.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
