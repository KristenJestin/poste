# Aucune sortie audio ne passe en veille quand rien ne joue : sinon un son
# court (île : fin de réponse de l'IA, minuteur…) arrive pendant le réveil de
# la sortie et se perd. Toutes les sorties ALSA (casque USB, carte son, HDMI),
# quel que soit le matériel branché ; les entrées (micros) gardent la veille.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
