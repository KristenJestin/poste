[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=FiraCode Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
multiplier=7.0
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[colors-dark]
# Slightly translucent background to let the Acrylic blur show (like T3 Code).
alpha=0.88
# Hyprland 0.56 applies ext-background-effect-v1: without this, foot explicitly
# asks for "no blur" (hyprwm/Hyprland#15529).
blur=yes
