# poste-theme: Linear palette (linear.app, dark theme), "winding road" wallpaper.
# Sources (CSS variables of linear.app): bg-primary #08090a, bg-level-1 #0f1011,
# bg-marketing #010102, text-primary #f7f8f8, text-secondary #d0d6e0,
# text-tertiary #8a8f98, text-quaternary #62666d, accent-tint #18182f (personal accent: #ff8226, orange),
# red #eb5757, orange #fc7840, yellow #f0bf00, green #27a644, teal #00b8cc,
# blue #4ea7fc, plan #68cc58; the site's syntax highlighting for the vivid variants.
mode = "dark"

accent = "#ff8226"
selection = "#2b2118"
muted = "#62666d"

# Neutral borders (active windows, menus, panels, popups): the orange
# accent stays reserved for active elements.
hyprland_active_border = "#80848c"
hyprland_inactive_border = "#141517"

background = "#08090a"
dark_background = "#050506"
darker_background = "#010102"
lighter_background = "#0f1011"

foreground = "#d0d6e0"
dark_foreground = "#8a8f98"
light_foreground = "#e2e4e7"
bright_foreground = "#f7f8f8"

red = "#eb5757"
yellow = "#f0bf00"
orange = "#fc7840"
green = "#27a644"
cyan = "#00b8cc"
blue = "#4ea7fc"
magenta = "#828fff"
brown = "#8a5a3c"

bright_red = "#f34e52"
bright_yellow = "#ffdf9f"
bright_green = "#68cc58"
bright_cyan = "#83dcdc"
bright_blue = "#5eb0ff"
bright_magenta = "#f79ce0"
