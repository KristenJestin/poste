<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Tabler icons in the Omarchy shell (poste, bootstrap/icons/README.md).

  To be put in ~/.config/fontconfig/conf.d/ (read by /etc/fonts/conf.d/50-user.conf),
  never in fonts.conf: omarchy-font-set rewrites it entirely.

  For the shell process only (quickshell), 'monospace' becomes 'Poste Nerd Font':
  FiraCode Nerd Font whose Nerd icons used by Omarchy are drawn by Tabler.
  Terminals and other apps are not touched.

  Why assign_replace and not prepend_first: conf.d is read BEFORE fonts.conf, whose rule
  adds FiraCode at the head as long as 'monospace' stays in the list (45-generic and
  49-sansserif put it back several times). The whole list is therefore replaced, without
  'monospace', with explicit fallbacks.
-->
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Poste Nerd Font</string>
      <string>FiraCode Nerd Font</string>
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
