# Proton VPN (proton-vpn-cli / OmaProton) : ranger la session dans un fichier JSON
# (~/.config/Proton/VPN/keyring-*.json) plutôt que dans le trousseau GNOME.
# Le trousseau d'Omarchy est un fichier en clair qui ne supporte pas les secrets
# multi-lignes : la session Proton l'avait corrompu (2026-09-30).
PROTON_LOADER_OVERRIDES=keyring=json
