# Proton VPN (proton-vpn-cli / OmaProton): store the session in a JSON file
# (~/.config/Proton/VPN/keyring-*.json) rather than in the GNOME keyring.
# Omarchy's keyring is a plain file that does not support multi-line
# secrets: the Proton session had corrupted it (2026-09-30).
PROTON_LOADER_OVERRIDES=keyring=json
