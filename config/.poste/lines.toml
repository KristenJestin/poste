# Base lines put by `poste sys setup` in files without an include (owner
# 'config' in installed.json). Same format as the [[line]] of a module.toml;
# `{home}` = home folder, `{modules}` = ~/.local/share/poste/modules.
#
# xdph.conf is no longer a link to the repository: it is an ordinary file of which poste only manages
# the lines below and those of the modules (e.g. custom_picker_binary of the record module).

[[line]]
file = "~/.config/hypr/xdph.conf"
line = "screencopy:allow_token_by_default = true"
